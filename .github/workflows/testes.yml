name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  motor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Base sintética é reprodutível
        run: |
          python3 src/gerar_base.py
          git diff --exit-code -- dados/exemplo/pessoas.csv dados/exemplo/ligacoes.csv dados/exemplo/gabarito.json
      - name: Testes do motor
        run: node testes/teste_motor.js
      - name: Teste do conversor de Forms
        run: python3 testes/teste_converter.py
      - name: Página num arquivo só está atualizada
        run: |
          python3 src/montar_pagina.py
          git diff --exit-code -- dist/ona-de-bolso.html web/exemplo.js
