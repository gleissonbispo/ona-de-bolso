name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar
        run: uv sync --locked
      - name: Base sintética é reprodutível
        run: |
          uv run python scripts/gerar_base.py
          git diff --exit-code -- ona_de_bolso/exemplo/
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Testes (pytest, inclui paridade com o motor JS e o app Streamlit)
        run: uv run pytest -q
      - name: O app importa sem erro
        run: uv run python -c "import ast, pathlib; ast.parse(pathlib.Path('app/app.py').read_text()); import streamlit, altair, ona_de_bolso"
      - name: Linha de comando na base de exemplo
        run: |
          uv run ona-de-bolso exemplo /tmp/ex
          uv run ona-de-bolso analisar /tmp/ex/pessoas.csv /tmp/ex/ligacoes.csv --saida /tmp/relatorio.html
      - name: A demo do navegador está em dia com o código
        run: |
          uv run python scripts/montar_demo.py
          git diff --exit-code demo/index.html
