<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONA de bolso</title>
<meta name="description" content="Análise de rede organizacional (ONA) a partir de um questionário e duas planilhas. Tudo calculado no navegador.">
<style>
  :root {
    --background:#ffffff; --foreground:#0a0a0a; --surface:#fafafa; --secondary:#525252; --muted:#a3a3a3;
    --accent:#8b5e3c; --accent-hover:#73492e; --accent-subtle:#faf3ee; --border-clr:#eaeaea;
    --site-font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --background:#0a0a0a; --foreground:#f5f5f5; --surface:#111111; --secondary:#a3a3a3; --muted:#6b6b6b;
      --accent:#c4895a; --accent-hover:#d4966a; --accent-subtle:rgba(139,94,60,.14); --border-clr:rgba(255,255,255,.09);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"] {
    --background:#0a0a0a; --foreground:#f5f5f5; --surface:#111111; --secondary:#a3a3a3; --muted:#6b6b6b;
    --accent:#c4895a; --accent-hover:#d4966a; --accent-subtle:rgba(139,94,60,.14); --border-clr:rgba(255,255,255,.09);
    color-scheme:dark;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--background); color:var(--foreground);
         font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:1080px; margin:0 auto; padding:40px 16px 80px; }
  header.topo { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
  .eyebrow { font-family:var(--site-font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); display:inline-flex; align-items:center; gap:8px; }
  .eyebrow::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--accent); }
  h1 { font-size:clamp(34px,6vw,52px); font-weight:500; letter-spacing:-.03em; line-height:1.05; margin:14px 0 14px; }
  .sub { font-size:18px; color:var(--secondary); max-width:42rem; margin:0 0 32px; }
  .tema { height:36px; padding:0 14px; border-radius:999px; border:1px solid var(--border-clr); background:var(--background); color:var(--secondary); font:inherit; font-size:13px; cursor:pointer; white-space:nowrap; }
  .tema:hover { color:var(--foreground); border-color:var(--accent); }
  footer { max-width:1080px; margin:0 auto; padding:24px 16px 48px; border-top:1px solid var(--border-clr); font-size:13px; color:var(--secondary); display:flex; flex-wrap:wrap; gap:8px 24px; justify-content:space-between; }
  footer a { color:var(--secondary); }
</style>
</head>
<body>
<main>
  <header class="topo">
    <div>
      <span class="eyebrow">People Analytics · ONA</span>
      <h1>ONA de bolso</h1>
    </div>
    <button class="tema" id="tema" type="button" aria-label="Trocar tema claro ou escuro">Tema: automático</button>
  </header>
  <p class="sub">Solte a tabela de pessoas e a de ligações do seu questionário de rede e veja como a informação circula: quem conecta as áreas, onde estão os silos e o que acontece se alguém sair.</p>
  <div id="ona"></div>
</main>
<footer>
  <span>ONA de bolso · Gleisson Bispo · licença MIT</span>
  <span><a href="https://github.com/gleissonbispo/ona-de-bolso">código</a> · <a href="https://gleissonbispo.com.br">gleissonbispo.com.br</a></span>
</footer>
<script src="ona-motor.js"></script>
<script src="ona-ui.js"></script>
<script src="exemplo.js"></script>
<script>
(function () {
  var modos = ["auto", "light", "dark"], nomes = { auto: "automático", light: "claro", dark: "escuro" }, atual = "auto";
  try { atual = localStorage.getItem("ona-tema") || "auto"; } catch (e) {}
  function aplicar() {
    if (atual === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", atual);
    document.getElementById("tema").textContent = "Tema: " + nomes[atual];
  }
  document.getElementById("tema").onclick = function () {
    atual = modos[(modos.indexOf(atual) + 1) % 3];
    try { localStorage.setItem("ona-tema", atual); } catch (e) {}
    aplicar();
  };
  var q = new URLSearchParams(location.search);
  if (q.get("tema") === "escuro") atual = "dark"; else if (q.get("tema") === "claro") atual = "light";
  aplicar();
  var app = OnaUI.montar(document.getElementById("ona"), { exemplo: window.EXEMPLO, abrirExemplo: location.hash.indexOf("exemplo") >= 0, rolar: location.hash.indexOf("exemplo") < 0 });
  window.onaApp = app;
})();
</script>
</body>
</html>
